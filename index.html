<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FOoDelivery</title>

    <style>

        body {
            font-family: sans-serif;
            background: #f5f5f5;
            padding: 40px;
        }

        h1 {
            color: orange;
        }

        .container {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
        }

        .food-card {
            background: white;
            padding: 20px;
            border-radius: 20px;
            width: 320px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .food-card img {
            border-radius: 12px;
        }

        button {
            background: orange;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
        }

        button:hover {
            opacity: 0.9;
        }

        .cart {
            background: white;
            padding: 20px;
            border-radius: 20px;
            width: 320px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .cart-item {
            border-bottom: 1px solid #ddd;
            padding: 10px 0;
        }

        .total {
            font-size: 24px;
            font-weight: bold;
            color: green;
            margin-top: 20px;
        }

    </style>
</head>

<body>

    <h1>🍛 ร้านตามสั่ง By ครัวหลังบ้าน</h1>

    <p>
        👋 สวัสดี
        <span id="username"></span>
    </p>

    <p>บริการสั่งอาหารออนไลน์</p>

    <div class="container">

        <!-- FOOD CARD -->
        <div class="food-card">

            <img
                src="https://images.unsplash.com/photo-1504674900247-0877df9cc836?q=80&w=1200&auto=format&fit=crop"
                width="300"
            >

            <h2>ข้าวกะเพราหมูกรอบ</h2>

            <p>ราคา 80 บาท</p>

            <h3>🌶 ระดับความเผ็ด</h3>

            <select id="spicy-level">

                <option>ไม่เผ็ด</option>
                <option>เผ็ดน้อย</option>
                <option>เผ็ดกลาง</option>
                <option>เผ็ดมาก</option>

            </select>

            <h3>🍳 เพิ่มท็อปปิ้ง</h3>

            <label>

                <input type="checkbox" id="egg">

                ไข่ดาว +15 บาท

            </label>

            <br><br>

            <label>

                <input type="checkbox" id="cheese">

                ชีส +20 บาท

            </label>

            <br><br>

            <button onclick="addToCart()">
                เพิ่มลงตะกร้า
            </button>

        </div>

        <!-- CART -->
        <div class="cart">

            <h2>🛒 ตะกร้าสินค้า</h2>

            <div id="cart-items"></div>

            <div class="total">

                รวม:
                <span id="total-price">0</span>
                บาท

            </div>

            <br>

            <button onclick="checkout()">
                ✅ ยืนยันออเดอร์
            </button>

        </div>

    </div>

    <!-- LIFF SDK -->
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

    <script>

        // =========================
        // CART
        // =========================

        let cart = [];

        // =========================
        // เพิ่มสินค้า
        // =========================

        function addToCart() {

            let basePrice = 80;

            let toppings = [];

            let extraPrice = 0;

            // ระดับความเผ็ด
            const spicyLevel =
                document.getElementById("spicy-level").value;

            // ไข่ดาว
            const egg =
                document.getElementById("egg").checked;

            if (egg) {

                toppings.push("ไข่ดาว");

                extraPrice += 15;
            }

            // ชีส
            const cheese =
                document.getElementById("cheese").checked;

            if (cheese) {

                toppings.push("ชีส");

                extraPrice += 20;
            }

            // ราคาสุดท้าย
            const finalPrice =
                basePrice + extraPrice;

            // หาเมนูเดิม
            const existingItem =
                cart.find((item) => {

                    return (

                        item.name === "ข้าวกะเพราหมูกรอบ" &&

                        item.spicy === spicyLevel &&

                        JSON.stringify(item.toppings)
                        === JSON.stringify(toppings)

                    );

                });

            // ถ้ามีเมนูเดิม
            if (existingItem) {

                existingItem.quantity += 1;

            } else {

                const food = {

                    name: "ข้าวกะเพราหมูกรอบ",

                    spicy: spicyLevel,

                    toppings: toppings,

                    price: finalPrice,

                    quantity: 1
                };

                cart.push(food);
            }

            renderCart();
        }

        // =========================
        // แสดงตะกร้า
        // =========================

        function renderCart() {

            const cartItems =
                document.getElementById("cart-items");

            const totalPrice =
                document.getElementById("total-price");

            cartItems.innerHTML = "";

            let total = 0;

            // วนลูปสินค้า
            cart.forEach((item) => {

                total +=
                    item.price * item.quantity;

                cartItems.innerHTML += `

                    <div class="cart-item">

                        <h3>${item.name}</h3>

                        <p>
                            🌶 ${item.spicy}
                        </p>

                        <p>
                            🍳 ${item.toppings.join(", ")}
                        </p>

                        <p>
                            ${item.price} บาท ×
                            ${item.quantity}
                        </p>

                    </div>

                `;
            });

            totalPrice.innerText = total;
        }

        // =========================
        // CHECKOUT
        // =========================

        async function checkout() {

            if (cart.length === 0) {

                alert("กรุณาเลือกอาหารก่อน");

                return;
            }

            let orderMessage =
                "🛒 ออเดอร์ใหม่\n\n";

            let total = 0;

            cart.forEach((item) => {

                orderMessage +=
                    `${item.name}\n`;

                orderMessage +=
                    `🌶 ${item.spicy}\n`;

                orderMessage +=
                    `🍳 ${item.toppings.join(", ")}\n`;

                orderMessage +=
                    `จำนวน: ${item.quantity}\n`;

                orderMessage +=
                    `รวม: ${
                        item.price * item.quantity
                    } บาท\n\n`;

                total +=
                    item.price * item.quantity;
            });

            orderMessage +=
                `💰 ราคารวม ${total} บาท`;

            // ส่งข้อมูลไป Apps Script
            await fetch(

                "https://script.google.com/macros/s/AKfycbyMtB7I8sE_oxiJZmRSzCkwEuMYn2ppq-m_Qnaz6ocq4f-6AUAFWgVmOk3xlm3uHwdh/exec",

                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        message: orderMessage
                    })
                }
            );

            alert("ส่งออเดอร์เรียบร้อย 🎉");

            cart = [];

            renderCart();
        }

        // =========================
        // LIFF LOGIN
        // =========================

        async function initializeLIFF() {

            await liff.init({

                liffId:
                    "2010184903-PSIDCmFU"
            });

            // ถ้ายังไม่ login
            if (!liff.isLoggedIn()) {

                liff.login();
            }

            // ดึงข้อมูล user
            const profile =
                await liff.getProfile();

            console.log(profile);

            // แสดงชื่อ
            document.getElementById("username")
                .innerText =
                profile.displayName;
        }

        initializeLIFF();

    </script>

</body>
</html>
