<!DOCTYPE html>

<html lang="th">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        ครัวหลังบ้าน
    </title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

    <header class="main-header">

        <h1>
            🍛 ครัวหลังบ้าน
        </h1>

        <p>

            👋 สวัสดี
            <span id="username">
                Guest
            </span>

        </p>

    </header>

    <section class="banner">

        <h2>
            โปรเด็ดวันนี้ 🔥
        </h2>

    </section>

    <section class="search-section">

        <input
            type="text"
            id="search-input"
            placeholder="ค้นหาเมนู"
            oninput="renderFoods()"
        >

    </section>

    <section class="category-section">

        <button onclick="filterCategory('ทั้งหมด')">
            ทั้งหมด
        </button>

        <button onclick="filterCategory('อาหาร')">
            อาหาร
        </button>

        <button onclick="filterCategory('เครื่องดื่ม')">
            เครื่องดื่ม
        </button>

    </section>

    <section
        class="food-grid"
        id="food-container"
    >

    </section>

    <aside class="cart-section">

        <h2>
            🛒 ตะกร้า
        </h2>

        <div id="cart-items">

        </div>

        <div class="total-price">

            รวม:
            <span id="total-price">
                0
            </span>
            บาท

        </div>

        <button
            class="checkout-btn"
            onclick="checkout()"
        >

            Checkout

        </button>

    </aside>

    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

    <script src="script.js"></script>

</body>

</html>
