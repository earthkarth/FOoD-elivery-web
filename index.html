<!DOCTYPE html>
<html lang="th">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>FOoDelivery</title>

    <style>

        body {

            font-family: sans-serif;
            background: #f5f5f5;
            padding: 40px;
        }

        h1 {

            color: orange;
        }

        .container {

            display: flex;
            gap: 30px;
            flex-wrap: wrap;
        }

        .food-card,
        .cart {

            background: white;

            padding: 20px;

            border-radius: 20px;

            width: 320px;

            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .food-card img {

            border-radius: 12px;
        }

        button {

            background: orange;

            color: white;

            border: none;

            padding: 12px 20px;

            border-radius: 10px;

            cursor: pointer;

            width: 100%;

            font-size: 16px;
        }

        .cart-item {

            border-bottom: 1px solid #ddd;

            padding: 10px 0;
        }

        .total {

            font-size: 24px;

            font-weight: bold;

            color: green;

            margin-top: 20px;
        }

    </style>

</head>

<body>
              <h1 style="color:red;">
              TEST NEW VERSION 18.24
              </h1>
    <h1>
        🍛 ร้านตามสั่ง By ครัวหลังบ้าน
    </h1>

    <p>

        👋 สวัสดี
        <span id="username">Guest</span>

    </p>

    <div class="container">

        <!-- FOOD -->
        <div class="container" id="food-container">

        </div>

        <!-- CART -->
        <div class="cart">

            <h2>
                🛒 ตะกร้าสินค้า
            </h2>

            <div id="cart-items"></div>

            <div class="total">

                รวม:
                <span id="total-price">0</span>
                บาท

            </div>

            <br>

            <button onclick="checkout()">

                ✅ ยืนยันออเดอร์

            </button>

        </div>

    </div>

    <!-- LIFF -->
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

    <script src="script.js?v=2"></script>

</body>
</html>
