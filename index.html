<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Food Delivery</title>

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: sans-serif;
      background: #f5f5f5;
      padding: 40px;
    }

    h1 {
      color: orange;
      margin-bottom: 10px;
    }

    p {
      margin-bottom: 10px;
    }

    .container {
      display: flex;
      gap: 30px;
      align-items: flex-start;
      flex-wrap: wrap;
    }

    .food-card {
      background: white;
      padding: 20px;
      border-radius: 20px;
      width: 350px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    .food-card img {
      width: 100%;
      border-radius: 12px;
      margin-bottom: 15px;
    }

    select {
      width: 100%;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid #ddd;
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 10px;
    }

    button {
      background: orange;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 10px;
      cursor: pointer;
      margin-top: 10px;
      font-size: 16px;
    }

    button:hover {
      opacity: 0.9;
    }

    .cart {
      background: white;
      padding: 20px;
      border-radius: 20px;
      width: 350px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    .cart-item {
      border-bottom: 1px solid #ddd;
      padding: 15px 0;
    }

    .cart-item h3 {
      margin-bottom: 10px;
    }

    .quantity-control {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 10px;
      margin-bottom: 10px;
    }

    .quantity-control button {
      margin-top: 0;
      padding: 8px 15px;
    }

    .total {
      font-size: 24px;
      font-weight: bold;
      color: green;
      margin-top: 20px;
    }

    .empty-cart {
      color: #999;
      margin-top: 15px;
    }

    @media(max-width: 768px) {

      body {
        padding: 20px;
      }

      .food-card,
      .cart {
        width: 100%;
      }

    }

  </style>
</head>

<body>

    <h1>🍛 ร้านตามสั่ง By ครัวหลังบ้าน</h1>

        <p>
            👋 สวัสดี
            <span id="username"></span>
        </p>

        <p>
            บริการสั่งอาหารออนไลน์
        </p>

  <div class="container">

    <!-- FOOD CARD -->
    <div class="food-card">

      <img
        src="https://images.unsplash.com/photo-1504674900247-0877df9cc836?q=80&w=1200&auto=format&fit=crop"
      />

      <h2>ข้าวกะเพราหมูกรอบ</h2>

      <p>ราคาเริ่มต้น 80 บาท</p>

      <!-- SPICY -->
      <h3>🌶 ระดับความเผ็ด</h3>

      <select id="spicy-level">

        <option>ไม่เผ็ด</option>
        <option>เผ็ดน้อย</option>
        <option>เผ็ดกลาง</option>
        <option>เผ็ดมาก</option>

      </select>

      <!-- TOPPING -->
      <h3>🍳 เพิ่มท็อปปิ้ง</h3>

      <label>
        <input type="checkbox" id="egg">
        ไข่ดาว +15 บาท
      </label>

      <label>
        <input type="checkbox" id="cheese">
        ชีส +20 บาท
      </label>

      <!-- BUTTON -->
      <button onclick="addToCart()">
        เพิ่มลงตะกร้า
      </button>

    </div>

    <!-- CART -->
    <div class="cart">

      <h2>🛒 ตะกร้าสินค้า</h2>

      <div id="cart-items">

        <p class="empty-cart">
          ยังไม่มีสินค้าในตะกร้า
        </p>

      </div>

      <div class="total">

        รวม:
        <span id="total-price">0</span>
        บาท

      </div>

    </div>

  </div>

  <script>

    // เก็บข้อมูลตะกร้า
    let cart = [];

    // เพิ่มสินค้า
    function addToCart() {

      let basePrice = 80;

      let toppings = [];

      let extraPrice = 0;

      // ระดับความเผ็ด
      const spicyLevel =
        document.getElementById("spicy-level").value;

      // เช็คไข่ดาว
      const egg =
        document.getElementById("egg").checked;

      if (egg) {

        toppings.push("ไข่ดาว");

        extraPrice += 15;
      }

      // เช็คชีส
      const cheese =
        document.getElementById("cheese").checked;

      if (cheese) {

        toppings.push("ชีส");

        extraPrice += 20;
      }

      // ราคาสุดท้าย
      const finalPrice =
        basePrice + extraPrice;

      // หาเมนูเดิม
      const existingItem = cart.find((item) => {

        return (

          item.name === "ข้าวกะเพราหมูกรอบ" &&

          item.spicy === spicyLevel &&

          JSON.stringify(item.toppings)
          === JSON.stringify(toppings)

        );

      });

      // ถ้ามีเมนูเดิม
      if (existingItem) {

        existingItem.quantity += 1;

      } else {

        // สร้างสินค้าใหม่
        const food = {

          name: "ข้าวกะเพราหมูกรอบ",

          spicy: spicyLevel,

          toppings: toppings,

          price: finalPrice,

          quantity: 1
        };

        cart.push(food);
      }

      renderCart();

      resetForm();
    }

    // แสดงตะกร้า
    function renderCart() {

      const cartItems =
        document.getElementById("cart-items");

      const totalPrice =
        document.getElementById("total-price");

      // ถ้าไม่มีสินค้า
      if (cart.length === 0) {

        cartItems.innerHTML = `
          <p class="empty-cart">
            ยังไม่มีสินค้าในตะกร้า
          </p>
        `;

        totalPrice.innerText = 0;

        return;
      }

      // ล้างข้อมูลเก่า
      cartItems.innerHTML = "";

      let total = 0;

      // วนลูปสินค้า
      cart.forEach((item, index) => {

        total += item.price * item.quantity;

        cartItems.innerHTML += `

          <div class="cart-item">

            <h3>${item.name}</h3>

            <p>
              🌶 ${item.spicy}
            </p>

            <p>
              🍳 ${
                item.toppings.length > 0
                ? item.toppings.join(", ")
                : "ไม่มี"
              }
            </p>

            <div class="quantity-control">

              <button onclick="decreaseQuantity(${index})">
                -
              </button>

              <span>
                ${item.quantity}
              </span>

              <button onclick="increaseQuantity(${index})">
                +
              </button>

            </div>

            <p>
              รวม ${item.price * item.quantity} บาท
            </p>

          </div>

        `;

      });

      // แสดงราคารวม
      totalPrice.innerText = total;
    }

    // เพิ่มจำนวน
    function increaseQuantity(index) {

      cart[index].quantity += 1;

      renderCart();
    }

    // ลดจำนวน
    function decreaseQuantity(index) {

      cart[index].quantity -= 1;

      // ถ้าเหลือ 0 ให้ลบ
      if (cart[index].quantity <= 0) {

        cart.splice(index, 1);
      }

      renderCart();
    }

    // รีเซ็ตฟอร์ม
    function resetForm() {

      document.getElementById("spicy-level")
        .selectedIndex = 0;

      document.getElementById("egg")
        .checked = false;

      document.getElementById("cheese")
        .checked = false;
    }

  </script>

    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js">
    </script>

        <script>
            async function initializeLIFF() {

            await liff.init({
                liffId: 2010184903-PSIDCmFU
            });

            // ถ้ายังไม่ได้ login
            if (!liff.isLoggedIn()) {

                liff.login();

            }

            // ดึงข้อมูล user
            const profile = await liff.getProfile();

            console.log(profile);

            // แสดงชื่อผู้ใช้
            document.getElementById("username")
                .innerText = profile.displayName;
            }

            initializeLIFF();
        </script>

</body>
</html>
