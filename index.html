<!DOCTYPE html>
<html lang="th">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>FOoDelivery</title>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

</head>

<body>

    <h1>🍛 ร้านตามสั่ง By ครัวหลังบ้าน</h1>

    <p>
        👋 สวัสดี
        <span id="username">
            Guest
        </span>
    </p>

    <div class="container">

        <!-- FOOD CARD -->
        <div class="food-card">

            <img
                src="https://images.unsplash.com/photo-1504674900247-0877df9cc836?q=80&w=1200&auto=format&fit=crop"
                width="300"
            >

            <h2>ข้าวกะเพราหมูกรอบ</h2>

            <p>ราคา 80 บาท</p>

            <h3>🌶 ระดับความเผ็ด</h3>

            <select id="spicy-level">

                <option>ไม่เผ็ด</option>
                <option>เผ็ดน้อย</option>
                <option>เผ็ดกลาง</option>
                <option>เผ็ดมาก</option>

            </select>

            <h3>🍳 เพิ่มท็อปปิ้ง</h3>

            <label>

                <input type="checkbox" id="egg">

                ไข่ดาว +15 บาท

            </label>

            <br><br>

            <label>

                <input type="checkbox" id="cheese">

                ชีส +20 บาท

            </label>

            <br><br>

            <button onclick="addToCart()">
                เพิ่มลงตะกร้า
            </button>

        </div>

        <!-- CART -->
        <div class="cart">

            <h2>🛒 ตะกร้าสินค้า</h2>

            <div id="cart-items"></div>

            <div class="total">

                รวม:
                <span id="total-price">0</span>
                บาท

            </div>

            <br>

            <button onclick="checkout()">
                ✅ ยืนยันออเดอร์
            </button>

        </div>

    </div>

    <!-- LIFF SDK -->
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

    <!-- JS -->
    <script src="script.js"></script>

</body>
</html>
